<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra - Fashion Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
    <img src="https://cdn.iconscout.com/icon/free/png-256/free-myntra-icon-svg-download-png-2249158.png"
         alt="Myntra Logo">
</div>

        <nav class="nav-links">
            <a href="#men">MEN</a>
            <a href="#women">WOMEN</a>
            <a href="#kids">KIDS</a>
            <a href="#home">HOME</a>
            <a href="#beauty">BEAUTY</a>
        </nav>

        <div class="search-box">
            <span>⌕</span>
            <input type="text" id="searchInput"
                placeholder="Search for products, brands and more">

        <div class="nav-actions">
            <div class="nav-item">
                <span>♙</span>
                <small>Profile</small>
            </div>

                <span>🛍</span>
                <small>Bag</small>
                <b id="bagCount">0</b>
            </div>
        </div>
    </header>
    <section class="hero">
        <div class="hero-content">
            <p>BIG FASHION FESTIVAL</p>
            <h1>STYLE YOUR<br>OWN STORY</h1>
            <h3>UP TO 70% OFF</h3>
            <a href="#products" class="shop-btn">SHOP NOW →</a>
